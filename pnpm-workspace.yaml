packages:
  - "."

# esbuild's install script selects/downloads the platform binary used by Vite
# and the server bundle. Keep the build allow-list explicit and minimal.
onlyBuiltDependencies:
  - esbuild

# Keep security overrides at the workspace root: pnpm 11 no longer reads the
# legacy package.json#pnpm object. Upper bounds prevent an audit fix from
# silently crossing an unsupported major version.
overrides:
  "tailwindcss>nanoid": "3.3.7"
  "@opentelemetry/core@<2.8.0": ">=2.8.0 <3"
  "@smithy/config-resolver@<4.4.0": ">=4.4.0 <5"
  "@trpc/server@<11.18.0": "11.18.0"
  "axios@<1.17.0": ">=1.17.0 <2"
  "dompurify@<3.4.11": ">=3.4.11 <4"
  "drizzle-orm@<0.45.2": ">=0.45.2 <0.46"
  "esbuild@<=0.24.2": ">=0.25.0 <0.26"
  "fast-xml-parser@<5.7.0": ">=5.7.0 <6"
  "follow-redirects@<=1.15.11": ">=1.16.0 <2"
  "form-data@>=4.0.0 <4.0.6": ">=4.0.6 <5"
  "mdast-util-to-hast@<13.2.1": ">=13.2.1 <14"
  "mermaid@<=11.14.0": ">=11.15.0 <12"
  "path-to-regexp@<0.1.13": ">=0.1.13 <0.2.0"
  "picomatch@>=4.0.0 <4.0.4": ">=4.0.4 <5"
  "postcss@<8.5.10": ">=8.5.10 <9"
  "qs@<=6.15.1": ">=6.15.2 <7"
  "rollup@>=4.0.0 <4.59.0": ">=4.59.0 <5"
  "tar@<=7.5.10": ">=7.5.11 <8"
  "uuid@<11.1.1": ">=11.1.1 <12"

patchedDependencies:
  "wouter@3.7.1": "patches/wouter@3.7.1.patch"
