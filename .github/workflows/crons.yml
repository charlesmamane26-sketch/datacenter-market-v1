# RGPD maintenance crons — runs for free on GitHub Actions (no paid host cron needed).
# Requires the DATABASE_URL repository secret (Settings → Secrets and variables → Actions).
#
# SECURITY / OPS NOTE: these jobs run destructive DB commands (db:purge deletes
# leads permanently) from GitHub-hosted runners with a long-lived, delete-capable
# DATABASE_URL. That secret is only as safe as the DB's network exposure — do NOT
# leave the production database reachable from 0.0.0.0/0 to satisfy this workflow.
# Prefer one of:
#   - run these from inside the deployment's network (a host cron or a self-hosted
#     runner in the same VPC), and drop DATABASE_URL from Actions entirely; or
#   - keep this workflow but restrict DB ingress to GitHub's published runner IP
#     ranges and scope the credential to only the tables these jobs touch.
# The manual migrate-staging operation exists for the free Render staging service,
# which has no pre-deploy command, shell or one-off jobs. Never confirm it unless
# the DATABASE_URL repository secret has first been verified to target staging.
name: RGPD crons

permissions:
  contents: read

concurrency:
  group: rgpd-maintenance
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 3 * * *" # daily: purge stale unconverted leads (LEAD_RETENTION_DAYS)
    - cron: "30 * * * *" # hourly: cancel abandoned pending/unpaid orders
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run
        required: true
        default: maintenance
        type: choice
        options:
          - maintenance
          - migrate-staging
      confirm_staging_migration:
        description: Confirm that DATABASE_URL targets staging before migrating
        required: true
        default: false
        type: boolean
      expected_database_url_sha256:
        description: SHA-256 of the approved Render staging DATABASE_URL
        required: false
        default: ""
        type: string
jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # setup-node@v5 defaults package-manager-cache to true, which probes
          # pnpm from the lockfile before `corepack enable` installs it (next
          # step) and fails. We don't cache deps here, so turn it off.
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Verify staging migration target
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'migrate-staging'
        env:
          # Branch lock. Defaults to the repository's default branch so the
          # operation keeps working after this PR merges; set the
          # STAGING_MIGRATION_REF repository variable to a branch name to approve
          # a pre-merge staging migration, then clear it again afterwards.
          APPROVED_MIGRATION_REF: refs/heads/${{ vars.STAGING_MIGRATION_REF || github.event.repository.default_branch }}
          CONFIRM_STAGING_MIGRATION: ${{ inputs.confirm_staging_migration }}
          EXPECTED_DATABASE_URL_SHA256: ${{ inputs.expected_database_url_sha256 }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "$CONFIRM_STAGING_MIGRATION" != "true" ]; then
            echo "Refusing to migrate: confirm_staging_migration must be true."
            exit 1
          fi
          if [ "$GITHUB_REF" != "$APPROVED_MIGRATION_REF" ]; then
            echo "Refusing to migrate from an unapproved branch: only $APPROVED_MIGRATION_REF may migrate staging."
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_DATABASE_URL_SHA256" | grep -Eq '^[a-f0-9]{64}$'; then
            echo "Refusing to migrate: the staging database fingerprint is invalid."
            exit 1
          fi
          ACTUAL_DATABASE_URL_SHA256="$(printf '%s' "$DATABASE_URL" | sha256sum | cut -d' ' -f1)"
          if [ "$ACTUAL_DATABASE_URL_SHA256" != "$EXPECTED_DATABASE_URL_SHA256" ]; then
            echo "Refusing to migrate: GitHub and Render target different databases."
            exit 1
          fi
      - name: Apply committed migrations and verify staging
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'migrate-staging' && inputs.confirm_staging_migration == true && github.ref_name == (vars.STAGING_MIGRATION_REF || github.event.repository.default_branch)
        run: |
          pnpm db:migrate
          pnpm db:preflight
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Cancel stale orders
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'maintenance')
        run: pnpm db:cancel-stale
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          STALE_ORDER_HOURS: ${{ vars.STALE_ORDER_HOURS || '24' }}
      - name: Purge stale leads (daily schedule or manual run only)
        if: github.event.schedule == '0 3 * * *' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'maintenance')
        run: pnpm db:purge
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LEAD_RETENTION_DAYS: ${{ vars.LEAD_RETENTION_DAYS || '730' }}
